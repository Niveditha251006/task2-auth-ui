<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration UI</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="#">Niveditha UI</a>
  </nav>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="auth-box">

      <div class="text-center mb-4">
        <h2 id="formTitle">Login</h2>
      </div>

      <!-- Login Form -->
      <form id="loginForm">

        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Email" required>
        </div>

        <div class="mb-3 position-relative">
          <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>

          <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('loginPassword', this)"></i>
        </div>

        <button class="btn btn-primary w-100">Login</button>

        <p class="text-center mt-3">
          Don't have an account?
          <a href="#" onclick="showRegister()">Register</a>
        </p>

      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none;">

        <div class="mb-3">
          <input type="text" class="form-control" id="username" placeholder="Username" required>
          <small id="userMsg"></small>
        </div>

        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Email" required>
        </div>

        <div class="mb-3 position-relative">
          <input type="password" class="form-control" id="regPassword" placeholder="Password" required>

          <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('regPassword', this)"></i>
        </div>

        <div class="mb-3 position-relative">
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>

          <i class="bi bi-eye-slash toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
        </div>

        <button type="submit" class="btn btn-success w-100">
          Register
        </button>

        <p class="text-center mt-3">
          Already have an account?
          <a href="#" onclick="showLogin()">Login</a>
        </p>

      </form>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
